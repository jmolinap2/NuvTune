name: Publicar actualización

# Cada push a master compila el APK release y lo publica en el release fijo
# `latest` junto a un version.json; la app instalada lo consulta y ofrece
# actualizarse. Requiere que el repositorio sea publico (la app descarga sin
# credenciales).
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   ANDROID_DEBUG_KEYSTORE_B64  ~/.android/debug.keystore en base64. El build
#                               release se firma con esa clave (ver
#                               android/app/build.gradle.kts); sin la misma
#                               clave Android rechaza la actualizacion.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un despliegue a la vez; si llegan varios commits seguidos, se descartan los
# intermedios y gana el mas reciente.
concurrency:
  group: publicar-actualizacion
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el numero de compilacion sale del numero de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: NDK y CMake que fija el proyecto
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Restaurar la clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          # Sin el secreto, Gradle firmaria con una clave debug nueva y Android
          # rechazaria la actualizacion sobre lo instalado: mejor fallar aqui.
          test -n "$KEYSTORE_B64" || { echo "::error::Falta el secreto ANDROID_DEBUG_KEYSTORE_B64"; exit 1; }
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          # Que Gradle use exactamente este keystore y no otro.
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null ||
            { echo "::error::El secreto ANDROID_DEBUG_KEYSTORE_B64 no contiene un keystore valido"; exit 1; }
          KEYSTORE_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey |
            sed -n 's/^.*SHA256: //p' | tr -d ':[:space:]' | tr 'A-Z' 'a-z')
          echo "KEYSTORE_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"
          echo "Huella del keystore del secreto: $KEYSTORE_SHA256"

      - name: Compilar
        run: |
          # Misma formula que tool/deploy.ps1.
          BUILD=$((100 + $(git rev-list --count HEAD)))
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          flutter pub get
          flutter build apk --release \
            --build-number="$BUILD" --target-platform android-arm64

      - name: Preparar el sitio
        run: |
          mkdir site
          cp build/app/outputs/flutter-apk/app-release.apk site/NuvTune.apk
          # Falla si el APK no quedo firmado con la clave del secreto: Android
          # rechazaria la actualizacion sobre la app ya instalada.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "No se encontro apksigner"; exit 1; }
          SIGNER_OUT=$("$APKSIGNER" verify --print-certs site/NuvTune.apk 2>&1) || true
          echo "$SIGNER_OUT"
          CERTIFICATE_SHA256=$(echo "$SIGNER_OUT" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          test -n "$CERTIFICATE_SHA256" || { echo "::error::No se pudo leer el certificado del APK"; exit 1; }
          test "$CERTIFICATE_SHA256" = "$KEYSTORE_SHA256" ||
            { echo "::error::El APK quedo firmado con $CERTIFICATE_SHA256 y no con la clave del secreto ($KEYSTORE_SHA256)"; exit 1; }
          NAME=$(sed -n 's/^version: *\([0-9A-Za-z.-]*\)+.*/\1/p' pubspec.yaml)
          jq -n \
            --argjson build "$BUILD" \
            --arg name "$NAME" \
            --arg message "$(git log -1 --format=%s)" \
            --argjson bytes "$(stat -c %s site/NuvTune.apk)" \
            '{build:$build, name:$name, message:$message, apk:"NuvTune.apk", bytes:$bytes}' \
            > site/version.json
          cat site/version.json

      - name: Publicar en el release latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Última versión" \
            --notes "Publicado automáticamente por CI; la app lo consulta."
          # Primero el APK y despues el manifiesto: la app nunca ve un
          # version.json que apunte a un APK aun inexistente.
          gh release upload latest site/NuvTune.apk --clobber
          gh release upload latest site/version.json --clobber
