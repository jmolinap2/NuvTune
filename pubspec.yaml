name: nuvtune
description: "NuvTune — reproductor de musica local con motor nativo Media3, ecualizador y edicion de metadatos."
publish_to: 'none'

version: 1.4.5+19

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegacion
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # Persistencia local
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Permisos y sistema
  permission_handler: ^12.0.3
  # Portadas
  palette_generator: ^0.3.3+7
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

  # Utilidades
  intl: ^0.20.3
  collection: ^1.19.1

  # Red y contenido en linea
  http: ^1.2.2
  connectivity_plus: ^7.0.0
  webview_flutter: ^4.10.0
  # Uso directo de AndroidWebViewCookieManager en youtube_login_screen.dart.
  webview_flutter_android: ^4.13.0
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/auris.png

  # Space Grotesk es la tipografia del sistema visual de NuvTune. Se empaqueta
  # en lugar de descargarla en ejecucion: la aplicacion funciona sin conexion y
  # la fuente no puede depender de la red. Es una fuente variable, de modo que
  # un solo archivo cubre todos los pesos.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
